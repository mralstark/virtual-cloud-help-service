name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTELEMETRY: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Static security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet ./...
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build commands
        run: go build -trimpath ./cmd/...
      - name: Build pinned container
        run: docker build --pull=false .

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: vchs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Real database permissions and concurrent revoke
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/vchs_test?sslmode=disable
        run: make integration
